name: 디올 재입고 확인

on:
  schedule:
    - cron: "0 * * * *"      # 매시간 다음 실행을 대기열에 올려둠 (한 실행은 5시간 동안 1분마다 확인)
  workflow_dispatch:          # 수동 실행 버튼
  push:                       # 파일이 바뀌면 실행

# 항상 하나만 실행: 실행 중이면 새 실행은 기다렸다가 이어받음
concurrency:
  group: restock-check
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # 끝날 때 다음 실행을 직접 예약하기 위해 필요

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # GitHub 예약 실행은 몇 시간씩 건너뛸 때가 있어서, 시작하자마자 다음 실행을 대기열에 올려둠
      # (실행 중인 동안 대기하다가, 이 실행이 끝나면 바로 이어받음)
      - name: 다음 실행 예약
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml -R ${{ github.repository }} --ref main
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 재고 확인 (1분 간격)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'dior-medaillon-5f0c9963' }}
        run: python check_stock.py
