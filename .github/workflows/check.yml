name: 디올 재입고 확인

on:
  schedule:
    - cron: "0 * * * *"      # 매시간 새로 시작 (안에서 1분마다 확인)
  workflow_dispatch:          # 수동 실행 버튼
  push:                       # 파일이 바뀌면 바로 새로 시작

# 항상 하나만 실행: 새 실행이 시작되면 이전 실행을 종료
concurrency:
  group: restock-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 재고 확인 (1분 간격)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'dior-medaillon-5f0c9963' }}
        run: python check_stock.py
